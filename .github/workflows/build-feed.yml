# Posts live in Supabase, but feed.xml is a static file. This rebuilds it from
# the posts table and commits it when it changed, so RSS readers stay current.
name: Build RSS feed

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild feed.xml
        run: node scripts/build-feed.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- feed.xml; then
            echo "feed.xml is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git commit -m "Update RSS feed"
          git push
